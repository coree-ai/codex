name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coree-version:
    uses: coree-ai/.github/.github/workflows/coree-version-check.yml@main

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.agents/plugins/marketplace.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/coree/.codex-plugin/plugin.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/coree/.mcp.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/coree/hooks/hooks.json', 'utf8'))"
          echo "All JSON files are valid"
